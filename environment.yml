name: cclmoff-env
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  - python=3.10
  - pip

  # numpy pinned to your version
  - numpy=1.23.5
  - scipy=1.9.3
  - pandas=1.5.2
  - matplotlib=3.6.2
  - seaborn=0.12.1
  - tqdm=4.64.1
  - scikit-learn=1.1.3  # install from conda to avoid build issues
